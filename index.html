<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>וואטסאפ למספר לא שמור</title>
<meta name="description" content="פתיחת צ'אט וואטסאפ למספר שלא שמור באנשי הקשר — הכל מקומי בדפדפן.">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="וואטסאפ לא שמור">
<style>
  :root{
    --bg:#0b0f14;
    --accent:#25D366;
    --accent-soft:rgba(37,211,102,.16);
    --sky:#0ea5e9;
    --text:#e8eef5;
    --muted:#8b9aab;
    --warn:#f5a524;
    --card:rgba(255,255,255,.05);
    --card-border:rgba(255,255,255,.09);
    --radius:22px;
    --font:'Heebo','Assistant','Rubik','Noto Sans Hebrew','Segoe UI',system-ui,-apple-system,'Arial Hebrew',sans-serif;
  }

  *{box-sizing:border-box}
  html,body{min-height:100%}

  body{
    margin:0;
    padding:32px 18px 40px;
    font-family:var(--font);
    color:var(--text);
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 520px at 50% -12%, rgba(37,211,102,.20), transparent 62%),
      radial-gradient(760px 520px at 50% 118%, rgba(14,165,233,.16), transparent 60%);
    background-attachment:fixed;
    background-repeat:no-repeat;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px}

  /* ---------- entrance ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  .fx{opacity:0;animation:fadeUp .62s cubic-bezier(.22,.9,.3,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.14s}.d3{animation-delay:.23s}.d4{animation-delay:.32s}
  @media (prefers-reduced-motion:reduce){
    .fx{animation:none;opacity:1}
    *{transition:none!important}
  }

  /* ---------- header ---------- */
  header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .mark{
    width:74px;height:74px;border-radius:24px;
    display:grid;place-items:center;
    background:linear-gradient(160deg, rgba(37,211,102,.22), rgba(37,211,102,.06));
    border:1px solid rgba(37,211,102,.28);
    box-shadow:0 18px 40px -18px rgba(37,211,102,.75), inset 0 1px 0 rgba(255,255,255,.09);
    animation:pop .6s cubic-bezier(.22,1.2,.36,1) both;
  }
  .mark svg{width:40px;height:40px;display:block;filter:drop-shadow(0 3px 8px rgba(37,211,102,.45))}
  h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.4px}

  /* ---------- cards ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:18px;
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 24px 60px -34px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
  }

  /* ---------- label row ---------- */
  .labelrow{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:10px;
  }
  .labelrow label{font-size:13px;font-weight:600;color:#cfdae6;line-height:1.45;min-width:0}
  .labelrow label .hint{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
  .chip-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;font-size:12.5px;font-weight:600;color:#cfdae6;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:999px;padding:6px 11px;cursor:pointer;
    transition:transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
    white-space:nowrap;
  }
  .chip-btn:hover{background:var(--accent-soft);border-color:rgba(37,211,102,.4);color:#eafff2;transform:translateY(-1px)}
  .chip-btn:active{transform:translateY(0) scale(.97)}
  .chip-btn svg{width:14px;height:14px}

  /* ---------- input ---------- */
  input[type=tel],textarea{
    width:100%;font-family:inherit;color:var(--text);
    background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .field{position:relative;display:block}
  input[type=tel]{
    direction:ltr;text-align:center;
    font-size:25px;font-weight:700;letter-spacing:.6px;
    /* מקום שווה משני הצדדים כדי שהמספר יישאר ממורכז מתחת לכפתור ה-× */
    padding:15px 46px;
  }
  .clear-x{
    position:absolute;top:50%;left:9px;transform:translateY(-50%);
    width:32px;height:32px;padding:0;
    display:grid;place-items:center;
    color:var(--muted);
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:50%;cursor:pointer;
    transition:color .16s ease, background .16s ease, border-color .16s ease, transform .16s ease;
  }
  .clear-x svg{width:15px;height:15px}
  .clear-x:hover{color:#ffd9d9;background:rgba(255,90,90,.16);border-color:rgba(255,90,90,.34)}
  .clear-x:active{transform:translateY(-50%) scale(.9)}
  .clear-x:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(37,211,102,.28)}
  .clear-x[hidden]{display:none}
  input[type=tel]::placeholder{color:#54657a;font-weight:600;letter-spacing:.4px}
  input[type=tel]:focus,textarea:focus{
    border-color:rgba(37,211,102,.55);
    background:rgba(0,0,0,.36);
    box-shadow:0 0 0 4px rgba(37,211,102,.13);
  }
  input[type=tel].ok{border-color:rgba(37,211,102,.42)}
  input[type=tel].bad{border-color:rgba(245,165,36,.42)}
  input[type=tel].bad:focus{
    border-color:rgba(245,165,36,.6);
    box-shadow:0 0 0 4px rgba(245,165,36,.13);
  }

  .status{
    min-height:22px;margin-top:9px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:14px;font-weight:600;letter-spacing:.2px;
  }
  .status.ok{color:var(--accent)}
  .status.bad{color:var(--warn)}
  .status .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

  /* ---------- toggle ---------- */
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-top:16px;padding-top:15px;
    border-top:1px solid rgba(255,255,255,.07);
  }
  .toggle-row .t-label{font-size:14px;font-weight:600;color:#cfdae6}
  .toggle-row .t-note{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
  .switch{position:relative;flex:0 0 auto;width:48px;height:28px;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .track{
    position:absolute;inset:0;border-radius:999px;
    background:rgba(255,255,255,.11);
    border:1px solid rgba(255,255,255,.12);
    transition:background .22s ease, border-color .22s ease;
    pointer-events:none;
  }
  .track::after{
    content:'';position:absolute;top:3px;right:3px;
    width:20px;height:20px;border-radius:50%;
    background:#e8eef5;
    box-shadow:0 2px 6px rgba(0,0,0,.45);
    transition:transform .22s cubic-bezier(.3,1.4,.5,1), background .22s ease;
  }
  .switch input:checked + .track{background:var(--accent);border-color:rgba(37,211,102,.8)}
  .switch input:checked + .track::after{transform:translateX(-20px);background:#04140a}
  .switch input:focus-visible + .track{box-shadow:0 0 0 4px rgba(37,211,102,.22)}

  .msgbox{
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .3s ease, opacity .25s ease, margin-top .3s ease;
    margin-top:0;
  }
  .msgbox.open{max-height:210px;opacity:1;margin-top:12px}
  textarea{
    font-size:14.5px;line-height:1.55;padding:12px 14px;resize:vertical;min-height:88px;
  }
  textarea::placeholder{color:#54657a}

  /* ---------- primary button ---------- */
  .go{
    width:100%;margin-top:16px;
    font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.2px;
    color:#04140a;
    background:linear-gradient(180deg,#2ee973,#1fbb59);
    border:0;border-radius:16px;padding:15px 18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 16px 34px -16px rgba(37,211,102,.9);
    transition:transform .16s ease, box-shadow .2s ease, filter .2s ease;
  }
  .go svg{width:19px;height:19px}
  .go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 22px 40px -16px rgba(37,211,102,1);filter:brightness(1.04)}
  .go:active:not(:disabled){transform:translateY(0) scale(.99)}
  .go:disabled{
    cursor:not-allowed;opacity:.4;
    background:rgba(255,255,255,.12);color:#93a4b6;box-shadow:none;
  }

  /* ---------- recents ---------- */
  .rec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .rec-head h2{margin:0;font-size:14px;font-weight:700;color:#cfdae6}
  .clear{
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
    background:none;border:0;padding:4px 6px;border-radius:8px;cursor:pointer;
    transition:color .16s ease, background .16s ease;
  }
  .clear:hover{color:#ffb4b4;background:rgba(255,90,90,.1)}
  .rec-list{display:flex;flex-wrap:wrap;gap:8px}
  .rec{
    font-family:inherit;font-size:13.5px;font-weight:650;
    direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;
    color:#d6e2ee;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:999px;padding:7px 13px;cursor:pointer;
    transition:transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
  }
  .rec:hover{background:var(--accent-soft);border-color:rgba(37,211,102,.42);color:#eafff2;transform:translateY(-2px)}
  .rec:active{transform:translateY(0) scale(.97)}

  /* ---------- footer ---------- */
  .foot{
    text-align:center;font-size:12.5px;line-height:1.6;color:var(--muted);
    max-width:340px;margin:2px auto 0;
  }
  .foot .lock{color:#9fb0c2}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);
    max-width:calc(100% - 36px);
    background:rgba(16,22,30,.94);
    border:1px solid rgba(255,255,255,.14);
    color:var(--text);
    font-size:13.5px;font-weight:600;
    padding:11px 17px;border-radius:14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 18px 44px -18px rgba(0,0,0,1);
    opacity:0;pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:99;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  .hidden{display:none!important}

  /* בלי transition — הגובה חייב לחול מיד, לפני הגלילה אל הכפתור */
  #kbSpacer{height:0;flex:0 0 auto;width:100%}

  @media (max-width:380px){
    h1{font-size:23px}
    input[type=tel]{font-size:22px}
    .labelrow{flex-direction:column;align-items:flex-start;gap:8px}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="fx d1">
    <div class="mark" aria-hidden="true">
      <!-- בועת צ'אט -->
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 5C12.95 5 4 12.85 4 22.5c0 5.53 2.94 10.45 7.54 13.66.36.25.55.68.48 1.11l-1 6.06a1 1 0 0 0 1.45 1.05l6.9-3.62c.3-.16.65-.2.98-.11 1.15.3 2.36.5 3.65.5 11.05 0 20-7.85 20-17.5S35.05 5 24 5Z" fill="#25D366"/>
        <circle cx="16" cy="22.5" r="2.6" fill="#0b0f14"/>
        <circle cx="24" cy="22.5" r="2.6" fill="#0b0f14"/>
        <circle cx="32" cy="22.5" r="2.6" fill="#0b0f14"/>
      </svg>
    </div>
    <h1>וואטסאפ למספר לא שמור</h1>
  </header>

  <section class="card fx d2">

    <div class="labelrow">
      <label for="phone">מספר טלפון <span class="hint">(מקבל 050, ‎+972‎, 972 או בינלאומי)</span></label>
      <button type="button" class="chip-btn" id="pasteBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="12" height="12" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        הדבק מהלוח
      </button>
    </div>

    <div class="field">
      <input id="phone" type="tel" dir="ltr" inputmode="tel" autocomplete="off"
             autocapitalize="off" spellcheck="false" placeholder="050-123-4567">
      <button type="button" class="clear-x" id="clearX" aria-label="נקה שדה" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="toggle-row">
      <div>
        <span class="t-label">הודעה מוכנה מראש</span>
        <span class="t-note">הטקסט ייכנס לצ'אט מוכן לשליחה</span>
      </div>
      <span class="switch">
        <input type="checkbox" id="msgToggle" aria-label="הודעה מוכנה מראש">
        <span class="track"></span>
      </span>
    </div>

    <div class="msgbox" id="msgBox">
      <textarea id="msgText" placeholder="היי, מה קורה?" aria-label="תוכן ההודעה"></textarea>
    </div>

    <button class="go" id="goBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 0 1-.9-3.8A8.38 8.38 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5Z"/>
      </svg>
      פתח צ'אט
    </button>

  </section>

  <section class="card fx d3 hidden" id="recCard">
    <div class="rec-head">
      <h2>אחרונים במכשיר זה</h2>
      <button type="button" class="clear" id="clearBtn">נקה</button>
    </div>
    <div class="rec-list" id="recList"></div>
  </section>

  <p class="foot fx d4">
    <span class="lock">הכל רץ מקומית בדפדפן.</span> שום מספר לא נשלח לשום מקום.
  </p>

</div>

<!-- מתמלא בגובה המקלדת כשהיא נפתחת, כדי שיהיה לאן לגלול -->
<div id="kbSpacer" aria-hidden="true"></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     נרמול מספרים
     ============================================================ */
  var DEFAULT_CC = '972';

  function isIL(n) {
    return /^[2-9]\d{7,8}$/.test(n);
  }

  function normalize(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return null;

    // דגל בינלאומי לפי תחילת הקלט המקורי
    var intl = s.charAt(0) === '+' || s.slice(0, 2) === '00';

    var d = s.replace(/\D/g, '');
    if (d.slice(0, 2) === '00') { d = d.slice(2); intl = true; }
    if (!d) return null;

    // +972-050-123-4567 -> 972501234567 (ולא 9720501234567)
    if (d.slice(0, 3) === DEFAULT_CC && d.length >= 11) {
      var rest = d.slice(3).replace(/^0+/, '');
      return rest ? DEFAULT_CC + rest : null;
    }

    // מתחיל ב-0 => ישראלי בלבד, לא מנחשים מספר זר
    if (d.charAt(0) === '0') {
      var local = d.replace(/^0+/, '');
      return isIL(local) ? DEFAULT_CC + local : null;
    }

    if (intl) return d.length >= 8 ? d : null;
    if (isIL(d)) return DEFAULT_CC + d;
    return d.length >= 8 ? d : null;
  }

  function pretty(n) {
    if (!n) return '';
    if (n.slice(0, 3) === DEFAULT_CC) {
      var r = n.slice(3);
      if (r.length === 9) return '0' + r.slice(0, 2) + '-' + r.slice(2, 5) + '-' + r.slice(5);
      if (r.length === 8) return '0' + r.slice(0, 1) + '-' + r.slice(1, 4) + '-' + r.slice(4);
    }
    return '+' + n;
  }

  /* ============================================================
     אלמנטים
     ============================================================ */
  var phone     = document.getElementById('phone');
  var statusEl  = document.getElementById('status');
  var goBtn     = document.getElementById('goBtn');
  var pasteBtn  = document.getElementById('pasteBtn');
  var msgToggle = document.getElementById('msgToggle');
  var msgBox    = document.getElementById('msgBox');
  var msgText   = document.getElementById('msgText');
  var clearX    = document.getElementById('clearX');
  var kbSpacer  = document.getElementById('kbSpacer');
  var recCard   = document.getElementById('recCard');
  var recList   = document.getElementById('recList');
  var clearBtn  = document.getElementById('clearBtn');
  var toastEl   = document.getElementById('toast');

  var current = null;

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  /* ---------- אחרונים ---------- */
  var LS_KEY = 'wa-incognito:recents';
  var MAX_REC = 6;

  function loadRecents() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr.filter(function (x) { return typeof x === 'string' && /^\d{8,}$/.test(x); }).slice(0, MAX_REC);
    } catch (e) { return []; }
  }

  function saveRecents(arr) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(arr.slice(0, MAX_REC))); } catch (e) {}
  }

  function pushRecent(n) {
    var arr = loadRecents().filter(function (x) { return x !== n; });
    arr.unshift(n);
    saveRecents(arr);
    renderRecents();
  }

  function renderRecents() {
    var arr = loadRecents();
    recList.textContent = '';
    if (!arr.length) { recCard.classList.add('hidden'); return; }
    recCard.classList.remove('hidden');
    arr.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'rec';
      b.textContent = pretty(n);
      b.addEventListener('click', function () {
        phone.value = pretty(n);
        update();
        phone.focus();
      });
      recList.appendChild(b);
    });
  }

  /* ---------- מצב ---------- */
  function update() {
    var n = normalize(phone.value);
    current = n;

    if (!phone.value.trim()) {
      statusEl.textContent = '';
      statusEl.className = 'status';
    } else if (n) {
      statusEl.className = 'status ok';
      statusEl.textContent = '';
      var span = document.createElement('span');
      span.className = 'num';
      span.textContent = pretty(n);
      statusEl.appendChild(span);
      statusEl.appendChild(document.createTextNode(' ✓'));
    } else {
      statusEl.className = 'status bad';
      statusEl.textContent = 'המספר לא נראה תקין';
    }

    phone.classList.toggle('ok', !!n);
    phone.classList.toggle('bad', !n && !!phone.value.trim());
    clearX.hidden = phone.value.length === 0;
    goBtn.disabled = !n;
  }

  // עיצוב השדה עצמו — רק כשהסמן בסוף, כדי לא לשבור הקלדה באמצע
  function autoFormat() {
    var n = normalize(phone.value);
    if (!n) return;
    var atEnd = phone.selectionStart === phone.value.length &&
                phone.selectionEnd === phone.value.length;
    if (!atEnd) return;
    var p = pretty(n);
    if (p !== phone.value) {
      phone.value = p;
      try { phone.setSelectionRange(p.length, p.length); } catch (e) {}
    }
  }

  phone.addEventListener('input', function () {
    autoFormat();
    update();
  });

  phone.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); openChat(); }
  });

  /* ---------- ניקוי השדה ---------- */
  // mousedown ולא click, כדי שהשדה לא יאבד פוקוס והמקלדת לא תיסגר ותיפתח שוב
  clearX.addEventListener('mousedown', function (e) { e.preventDefault(); });
  clearX.addEventListener('click', function () {
    phone.value = '';
    update();
    phone.focus();
  });

  /* ============================================================
     המקלדת מסתירה את כפתור "פתח צ'אט" — פותחים מקום וגוללים אליו.
     ב-Android עם interactive-widget=resizes-content ה-layout viewport
     מתכווץ לבד; ב-iOS ובדפדפנים שמתעלמים מזה מתכווץ רק ה-visual
     viewport, ואז אין לאן לגלול — ולכן ה-spacer.
     ============================================================ */
  var vv = window.visualViewport;
  var scrollTimer = null;

  function keyboardGap() {
    if (!vv) return 0;
    return Math.max(0, document.documentElement.clientHeight - vv.height);
  }

  function revealGoBtn() {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
      var gap = keyboardGap();

      // המקלדת מכסה את ה-layout viewport (iOS): מחשבים מול ה-visual viewport,
      // אחרת block:'end' היה מיישר את הכפתור לתחתית שמוסתרת מאחורי המקלדת
      if (gap > 120 && vv) {
        var visibleBottom = vv.offsetTop + vv.height;
        var delta = goBtn.getBoundingClientRect().bottom + 16 - visibleBottom;
        if (delta > 0) {
          try { window.scrollBy({ top: delta, behavior: 'smooth' }); }
          catch (e) { window.scrollBy(0, delta); }
        }
        return;
      }

      try { goBtn.scrollIntoView({ behavior: 'smooth', block: 'end' }); }
      catch (e) { goBtn.scrollIntoView(false); }
    }, 120);
  }

  function onViewportChange() {
    var gap = keyboardGap();
    var open = gap > 120;
    kbSpacer.style.height = open ? gap + 'px' : '0px';
    if (open && isTyping()) revealGoBtn();
  }

  function isTyping() {
    var a = document.activeElement;
    return a === phone || a === msgText;
  }

  if (vv) {
    vv.addEventListener('resize', onViewportChange);
    vv.addEventListener('scroll', onViewportChange);
  }

  // גיבוי לדפדפנים בלי visualViewport, ולמקרה שהמקלדת נפתחת בלי אירוע resize
  [phone, msgText].forEach(function (el) {
    el.addEventListener('focus', function () {
      setTimeout(function () { if (isTyping()) revealGoBtn(); }, 300);
    });
    el.addEventListener('blur', function () {
      setTimeout(function () {
        if (!isTyping()) { kbSpacer.style.height = '0px'; clearTimeout(scrollTimer); }
      }, 100);
    });
  });

  /* ---------- פתיחת הצ'אט ---------- */
  function openChat() {
    var n = normalize(phone.value);
    if (!n) { toast('צריך מספר תקין כדי לפתוח צ\'אט'); return; }

    var url = 'https://wa.me/' + n;
    // אם הטוגל כבוי — הטקסט לא נשלח, גם אם נשאר בתיבה
    if (msgToggle.checked) {
      var t = msgText.value.trim();
      if (t) url += '?text=' + encodeURIComponent(t);
    }

    pushRecent(n);
    window.open(url, '_blank', 'noopener');
  }

  goBtn.addEventListener('click', openChat);

  /* ---------- הדבקה מהלוח ---------- */
  pasteBtn.addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      toast('הדפדפן לא מאפשר קריאה מהלוח — הדביקו ידנית');
      phone.focus();
      return;
    }
    navigator.clipboard.readText().then(function (txt) {
      var v = String(txt || '').trim();
      if (!v) { toast('הלוח ריק'); return; }
      phone.value = v;
      var n = normalize(v);
      if (n) phone.value = pretty(n);
      update();
      phone.focus();
      if (!n) toast('הודבק, אבל המספר לא נראה תקין');
    })['catch'](function () {
      toast('הדפדפן חסם קריאה מהלוח — הדביקו ידנית');
      phone.focus();
    });
  });

  /* ---------- טוגל ההודעה ---------- */
  msgToggle.addEventListener('change', function () {
    msgBox.classList.toggle('open', msgToggle.checked);
    if (msgToggle.checked) setTimeout(function () { msgText.focus(); }, 180);
  });

  /* ---------- ניקוי אחרונים ---------- */
  clearBtn.addEventListener('click', function () {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    renderRecents();
    toast('הרשימה נוקתה');
  });

  /* ---------- אתחול ---------- */
  renderRecents();
  update();
  phone.focus({ preventScroll: true });

  /* ---------- service worker ---------- */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js')['catch'](function () {});
    });
  }
})();
</script>
</body>
</html>
